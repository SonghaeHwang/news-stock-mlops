# 이 프로젝트의 모든 실행은 여기를 거친다. 사람 · CI · 서버가 같은 `task <이름>` 을 친다.
#   task --list        태스크 목록
version: "3"

env:
  PYTHONUTF8: "1" # Windows 에서도 한글 출력이 깨지지 않게

tasks:
  default:
    desc: 태스크 목록을 보여 준다
    silent: true
    cmds:
      - task --list

  setup:
    desc: 의존성을 설치한다 (uv.lock 그대로)
    cmds:
      - uv sync --locked --all-groups

  test:
    desc: 테스트를 돌린다
    cmds:
      - uv run --locked --all-groups pytest -q

  # ── 데이터 ─────────────────────────────────────────────
  data:prices:
    desc: 종목 · 지수의 일별 종가를 받는다 (OUT 기본값 data)
    cmds:
      - uv run --locked --group collect python -m collect.prices --out {{.OUT | default "data"}}

  data:bigkinds:query:
    desc: 빅카인즈 검색창에 넣을 종목별 검색어를 보여 준다 (기업명 + 대표 + 대표 상품)
    cmds:
      - uv run --locked --group collect python -m collect.bigkinds query

  data:bigkinds:
    desc: 빅카인즈에서 받은 엑셀(data/raw/bigkinds)을 모두 헤드라인 파일로 바꾼다 (보통은 data:ingest 를 쓴다)
    cmds:
      - uv run --locked --group collect python -m collect.bigkinds convert --out {{.OUT | default "data"}}

  data:ingest:
    desc: 새로 넣은 빅카인즈 엑셀(data/raw/bigkinds)을 변환하고 dataset/ 을 다시 만든다. REBUILD=1 이면 전부 다시 변환
    cmds:
      - uv run --locked --group collect python -m collect.ingest {{if .REBUILD}}--rebuild{{end}}

  data:submit:
    desc: 새 엑셀 반영 → 주가 → 검사 → dataset/ 을 커밋하고 올린다 (올라가면 model.yml 이 학습 · 검증 · 배포를 시작한다)
    cmds:
      - task: data:ingest
      - task: data:prices
      - task: data:check
      - git add dataset
      - cmd: >-
          git diff --cached --quiet -- dataset
          && echo "dataset/ 이 바뀌지 않았다 — 올릴 것이 없다"
          || (git commit -m "data: 헤드라인 건수 갱신 ($(git diff --cached --name-only -- dataset | wc -l | tr -d ' ')개 파일)" -- dataset && git push)

  data:watch:
    desc: data/raw/bigkinds 를 지켜보다가 새 엑셀이 들어오면 data:submit 을 실행한다 (Ctrl+C 로 멈춘다)
    cmds:
      - uv run --locked --group collect python -m collect.watch

  data:check:
    desc: 수집분을 검사한다 (종목 누락 · 빈 종목 · 중복 · 주가 날짜). DIR 기본값 data
    cmds:
      - uv run --locked --group collect python -m collect.check --dir {{.DIR | default "data"}}

  data:store:
    desc: 날짜별 건수(dataset/)를 버킷의 data/dataset/ 에 올린다 — 서버에서만 (MODEL_BUCKET)
    cmds:
      - python3 deploy/lightsail/models.py store {{.DATASET | default "dataset"}}

  data:fetch:
    desc: 지금 서비스 중인 모델을 버킷에서 artifacts/current 로 받는다 (게이트의 비교 대상) — 서버에서만
    cmds:
      - python3 deploy/lightsail/models.py current {{.CURRENT | default "artifacts/current"}}

  # ── 모델 ───────────────────────────────────────────────
  model:features:
    desc: 날짜별 건수(dataset/) + 주가 → 학습표 artifacts/dataset.csv
    cmds:
      - uv run --locked --group collect --group train python -m training.dataset --dataset {{.DATASET | default "dataset"}} --prices {{.PRICES | default "data/prices"}} --out {{.ART | default "artifacts"}}

  model:train:
    desc: 학습 (마지막 60거래일은 평가용). SAMPLE=0.05 처럼 주면 학습 행의 일부만 쓴다 (탈락 시연용)
    cmds:
      - uv run --locked --group collect --group train python -m training.train --art {{.ART | default "artifacts"}} --sample {{.SAMPLE | default "1.0"}}

  model:gate:
    desc: 검증 게이트 (데이터 · 기준선 · 현재 모델) — 탈락하면 종료 코드 1
    cmds:
      - uv run --locked --group collect --group train python -m training.gate --art {{.ART | default "artifacts"}} --current {{.CURRENT | default "artifacts/current"}}

  model:export:
    desc: ONNX 변환 → artifacts/model.onnx
    cmds:
      - uv run --locked --group collect --group train python -m training.export_onnx --art {{.ART | default "artifacts"}}

  model:parity:
    desc: scikit-learn 과 ONNX 의 답 비교 — 다르면 종료 코드 1
    cmds:
      - uv run --locked --group collect --group train python -m training.parity --art {{.ART | default "artifacts"}}

  model:card:
    desc: 모델 카드 artifacts/model.json (버전 이름 m<날짜>-<실행 번호>)
    cmds:
      - uv run --locked --group collect --group train python -m training.card --art {{.ART | default "artifacts"}} --version "{{.VERSION}}"

  model:
    desc: 학습표 → 학습 → 게이트 → ONNX → parity → 카드를 순서대로
    cmds:
      - task: model:features
      - task: model:train
      - task: model:gate
      - task: model:export
      - task: model:parity
      - task: model:card

  # ── 분석 (모델 · 배포와 따로 본다) ─────────────────────
  analysis:event:
    desc: 헤드라인이 나온 날의 전날 · 당일 · 다음 날 주가를 비교한다 (호재/악재 · 기사 양 · 언급 유형 · 휴장일)
    cmds:
      - uv run --locked --group collect --group train python -m analysis.event --dataset {{.DATASET | default "dataset"}} --prices {{.PRICES | default "data/prices"}}

  # ── API ────────────────────────────────────────────────
  # IMAGE 는 이미지 이름(레지스트리 경로 포함), TAG 는 v* 태그. CI 가 둘 다 넘긴다
  api:serve:
    desc: 로컬에서 API 를 띄운다 (8080). MODEL_DIR 기본값 artifacts — 모델이 없으면 기준선으로 답한다
    env:
      MODEL_DIR: '{{.MODEL_DIR | default "artifacts"}}'
    cmds:
      - uv run --locked --group api --group collect uvicorn api.app:app --port 8080

  api:image:
    desc: API 이미지를 만든다. IMAGE 기본값 news-api, TAG 기본값 dev (TAG 가 /health 의 app_version 이 된다)
    cmds:
      - docker build -f api/Dockerfile --build-arg APP_VERSION={{.TAG | default "dev"}} -t {{.IMAGE | default "news-api"}}:{{.TAG | default "dev"}} .

  api:push:
    desc: 만든 이미지를 레지스트리에 올린다 (docker login 은 미리) — CI 에서만
    cmds:
      - docker push {{.IMAGE | default "news-api"}}:{{.TAG | default "dev"}}

  api:run:
    desc: 만든 이미지를 로컬 컨테이너로 띄운다 (8080, artifacts/ 의 모델을 붙인다). 끄기는 docker rm -f news-api
    cmds:
      - cmd: docker rm -f news-api
        ignore_error: true
        silent: true
      - docker run -d --name news-api -p 8080:8080 -v "{{.ROOT_DIR}}/artifacts:/models/local:ro" -e MODEL_DIR=/models/local {{.IMAGE | default "news-api"}}:{{.TAG | default "dev"}}

  api:smoke:
    desc: /health 와 /predict 를 한 번씩 부른다. URL 기본값 http://localhost:8080 — 응답이 오류면 종료 코드가 0 이 아니다
    vars:
      URL: '{{.URL | default "http://localhost:8080"}}'
    cmds:
      - curl -fsS --retry 10 --retry-delay 1 --retry-all-errors {{.URL}}/health
      - echo
      - 'curl -fsS -X POST {{.URL}}/predict -H "content-type: application/json" --data-binary @api/smoke.json'
      - echo

  # ── 배포 (서버에서만) ──────────────────────────────────
  deploy:bootstrap:
    desc: 서버를 준비한다 (Docker · Task · /srv/news, RUNNER_URL · RUNNER_TOKEN 을 주면 러너 등록까지). 여러 번 돌려도 된다
    cmds:
      - bash deploy/lightsail/bootstrap.sh

  deploy:image:
    desc: 서버의 API 를 새 이미지(IMAGE:TAG)로 바꾼다. 안 뜨면 이전 태그로 돌아간다 (GHCR_TOKEN)
    requires:
      vars: [IMAGE, TAG]
    cmds:
      - bash deploy/lightsail/server.sh image {{.TAG}} {{.IMAGE}}

  deploy:promote:
    desc: 통과한 모델(artifacts/)을 버킷에 새 버전으로 올리고, 띄워서 확인한 뒤 포인터를 바꾼다 (MODEL_BUCKET)
    cmds:
      - python3 deploy/lightsail/models.py promote {{.ART | default "artifacts"}}

  deploy:rollback:
    desc: 버킷에 있는 VER 의 모델로 되돌린다. 안 뜨면 원래 버전으로 돌아가고 포인터는 그대로다 (MODEL_BUCKET)
    requires:
      vars: [VER]
    cmds:
      - python3 deploy/lightsail/models.py rollback {{.VER}}

  deploy:status:
    desc: 서버의 이미지 태그 · 모델 버전 · /health, 버킷의 모델 버전 목록과 포인터
    cmds:
      - bash deploy/lightsail/server.sh status
      - python3 deploy/lightsail/models.py list

# 검증 게이트 기준 (초안 — 실제 데이터로 점수를 뽑아 본 뒤 정한다. DESIGN.md 4.3)
holdout_days: 60          # 마지막 60거래일은 학습에서 떼어 평가에만 쓴다
data:
  min_rows_per_ticker: 200   # 종목마다 학습 행이 이만큼은 있어야 한다
  min_holdout_rows: 100      # 평가 행 (5종목 × 60일 = 300 이 정상)
  label_ratio: [0.35, 0.65]  # 정답 1 의 비율이 이 범위를 벗어나면 정답 계산을 의심한다
baseline:
  max_logloss_over: 0.005    # 모델의 logloss ≤ 기준선(학습 구간의 정답 비율로만 답하기) + 이 값
current:
  max_logloss_over: 0.005    # 모델의 logloss ≤ 지금 서비스 중인 모델 + 이 값 (같은 평가 구간)
parity:
  rows: 200
  max_diff: 0.0001           # scikit-learn 과 ONNX 의 확률 차이

[project]
name = "news-stock-mlops"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
api = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]
collect = [
    "finance-datareader>=0.9.202",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
train = [
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

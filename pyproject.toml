[project]
name = "news-stock-mlops"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
collect = [
    "finance-datareader>=0.9.202",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
